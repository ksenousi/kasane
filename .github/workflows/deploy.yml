name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # Docs-only changes don't touch the app, so don't redeploy (which would reload it on your phone).
    paths-ignore: ['README.md', 'docs/**', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Tests and build always run; deploying waits until the repo has a CLOUDFLARE_API_TOKEN secret.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: npm run build
