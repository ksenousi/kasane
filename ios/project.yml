name: Kasane
options:
  bundleIdPrefix: com.ksenousi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6LCQNGD229
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Kasane:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: KasaneWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kasane
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ksenousi.kasane.widgetapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  KasaneWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kasane
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ksenousi.kasane.widgetapp.widget
        TARGETED_DEVICE_FAMILY: "1,2"
